services:
  db:
    image: postgres:16-alpine
    container_name: phishcatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishcatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishcatch_password}
      POSTGRES_DB: ${POSTGRES_DB:-phishcatch_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishcatch_user} -d ${POSTGRES_DB:-phishcatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: phishcatch_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DATABASE_URL: postgresql://${POSTGRES_USER:-phishcatch_user}:${POSTGRES_PASSWORD:-phishcatch_password}@db:5432/${POSTGRES_DB:-phishcatch_db}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
    driver: local
